name: Sales guidance integration checks
on:
  push:
    branches: [develop]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
